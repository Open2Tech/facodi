project_id = "wvkjainfwsyiyfcmbtid"

[api]
schemas = ["public", "graphql_public", "facodi", "pgmq_public", "tube"]
extra_search_path = ["public", "facodi", "tube"]

[storage.vector]
enabled = false

[auth]
# Auth is shared with Tube O2. Values mirror the hosted project (verified with
# `supabase config push` diff on 2026-11-15); the global Auth email templates are FACODI-branded.
site_url = "https://facodi.com"
additional_redirect_urls = ["https://monynha.fun", "https://monynha.fun/**", "http://localhost:3000", "https://*.monynha.com", "https://monynha.com", "http://localhost:8080", "https://localhost:4173", "https://open2.tech", "https://facodi.com", "https://*.open2.tech", "https://*.facodi.com", "https://tube.open2.tech", "https://facodi.marcelo-m7.com", "https://dev.facodi.com", "https://tube.marcelo-m7.me", "https://facodi.vercel.app", "https://facodi.marcelo-0d6.workers.dev", "https://facodi.marcelo-0d6.workers.dev/auth/callback**", "https://facodi.marcelo-0d6.workers.dev/auth/reset-password**"]
enable_manual_linking = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_confirmations = true
otp_length = 8

[auth.email.template.invite]
subject = "FACODI · Convite de acesso"
content_path = "supabase/email-templates/facodi/invite.html"

[auth.email.template.confirmation]
subject = "FACODI · Confirme o seu email"
content_path = "supabase/email-templates/facodi/confirmation.html"

[auth.email.template.recovery]
subject = "FACODI · Redefinir palavra-passe"
content_path = "supabase/email-templates/facodi/recovery.html"

[auth.email.template.magic_link]
subject = "FACODI · Ligação para iniciar sessão"
content_path = "supabase/email-templates/facodi/magic_link.html"

[auth.email.template.email_change]
subject = "FACODI · Confirmar alteração de email"
content_path = "supabase/email-templates/facodi/email_change.html"

[auth.email.template.reauthentication]
subject = "FACODI · Código de verificação"
content_path = "supabase/email-templates/facodi/reauthentication.html"

[functions.enrich-video]
verify_jwt = true

[functions.import-youtube-playlist]
verify_jwt = true

[functions.import-video]
verify_jwt = true

[functions.mark-top-featured]
verify_jwt = true

[functions.facodi-curriculum]
verify_jwt = true
