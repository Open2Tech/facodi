name: FACODI Cloudflare Workers smoke

on:
  workflow_dispatch:
  push:
    branches: [facodi]

permissions:
  checks: read
  contents: read

concurrency:
  group: facodi-workers-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify deployed Cloudflare Workers build (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require the production branch
        if: github.ref != 'refs/heads/facodi'
        run: |
          echo "::error::Run this workflow on the facodi branch."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wait for the matching deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FACODI_WORKERS_ORIGIN: https://facodi.marcelo-0d6.workers.dev
        run: node scripts/verify-workers-deployment.mjs
      - name: Smoke test SPA routes, security headers, brand assets and social previews
        env:
          FACODI_WORKERS_ORIGIN: https://facodi.marcelo-0d6.workers.dev
        run: node scripts/smoke-facodi-workers.mjs
      - name: Note scope
        run: |
          echo "This checks the deployed commit, Worker shell routes, brand assets, social metadata and legal snapshots."
          echo "It does not mutate Supabase, authenticate users, or verify live client-side data."
